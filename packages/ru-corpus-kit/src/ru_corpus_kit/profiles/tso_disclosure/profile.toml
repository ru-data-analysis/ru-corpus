# Профиль «раскрытие информации сетевой организацией»: то, что относится к отрасли,
# а не к ядру. Подключается строкой  [profile] name = "tso_disclosure"  в corpus.toml.

name = "tso_disclosure"
description = "Классы таблиц (баланс, потери, структура затрат 1831-э, предложение о ценах), уровни напряжения, энергетические единицы, словарь сокращений, номера актов регулятора"

# файлы рядом с этим
synonyms = "synonyms.toml"
ocr_words = "ocr_words.txt"

# номер акта регулятора: ДПР-ТР-436/25, 492-ТД, 428-ТР
act_no = '((?:ДПР-)?(?:ТР|ТД)-\d{1,4}/\d{2}|\d{2,4}-(?:ТР|ТД)|ДПР-ТР-\d{1,4}/\d{2})'

# ячейка целиком — уровень напряжения (кроме «Всего», оно в ядре)
level_cell = 'ВН1?|СН[\s\-]*(?:1|2|I|II)|НН'

# энергетические единицы измерения (вставляются в разбор единиц между рублями и «%»)
extra_units = 'млн\.?\s*кВт[·\.\s]*ч|тыс\.?\s*кВт[·\.\s]*ч|МВт[·\.]?\s*ч|МВт|МВА|кВт[·\.]?\s*ч'

# уровни напряжения в заголовках граф; порядок важен (СН1 до ВН, «Всего» добавляет ядро)
[[levels]]
name = "СН1"
regex = '\bСН[\s\-]*(?:1|I)\b(?!I)'

[[levels]]
name = "СН2"
regex = '\bСН[\s\-]*(?:2|II)\b'

[[levels]]
name = "ВН1"
regex = '\bВН[\s\-]*1\b'

[[levels]]
name = "ВН"
regex = '\bВН\b'

[[levels]]
name = "НН"
regex = '\bНН\b'

# классы документов по первой странице: для них год берётся из названия документа
[[classes]]
name = "баланс электроэнергии и мощности"
regex = 'баланс\w* электр\w+ энерги\w+ и мощност'

[[classes]]
name = "потери электроэнергии"
regex = '(?:фактических |плановых )?потерях электр'

[[classes]]
name = "структура и объём затрат (1831-э)"
regex = 'структур\w+ (?:и объ[её]м\w* )?затрат|1831-э'

[[classes]]
name = "предложение о ценах (тарифы, НВВ)"
regex = 'предложени\w+ о размере цен|о размере цен \(тариф'
